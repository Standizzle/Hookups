* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  font-family: var(--font);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;

/* Ã¢Â”Â€Ã¢Â”Â€ PHONE SHELL Ã¢Â”Â€Ã¢Â”Â€ */
.phone {
  width: 390px;
  height: 844px;
  background: var(--surface);
  border-radius: 48px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 0 0 10px #1a2d2c,
    0 0 0 11px rgba(255,255,255,0.04),

}

.phone-inner {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Dynamic island */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 34px;
  background: #000;
  border-radius: 20px;
  z-index: 50;
}

/* Status bar */
.status-bar {
  height: 54px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 28px 8px;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

/* Screen */

  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;

.t-small   { font-size: 13px; font-weight: 500; line-height: 1.4; }
.t-micro   { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

  border: 1.5px solid var(--border);
}
.btn-ghost {
  background: transparent;
  color: var(--g600);

}
.btn-danger {
  background: var(--red);

.btn-sm { padding: 8px 16px; font-size: 13px; }

/* Ã¢Â”Â€Ã¢Â”Â€ DIVIDER Ã¢Â”Â€Ã¢Â”Â€ */

/* Ã¢Â”Â€Ã¢Â”Â€ DARK MODE Ã¢Â”Â€Ã¢Â”Â€ */

</style>

<script type="text/babel">

/* Ã¢Â•ÂÃ¢Â•Â LOGO Ã¢Â•ÂÃ¢Â•Â */
// D1 mark Ã¢Â€Â” two phone outlines (teal left, pink right) with gradient pulse dot at contact point

      <defs>
        <linearGradient id={`g-${id}`} x1="0" y1="0" x2="1" y2="0">

      <circle cx="48" cy="31" r="1.2" fill="#EC4899" />

};

/* Ã¢Â•ÂÃ¢Â•Â NAV BAR Ã¢Â•ÂÃ¢Â•Â */
const NavBar = ({ active=0, onTab }) => {

/* Ã¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•ÂÃ¢Â•Â
