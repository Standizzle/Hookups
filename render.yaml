# Render Blueprint — one service that serves both the built client SPA and
# the Fastify API from a single Docker image (see Dockerfile), plus managed
# Postgres and Redis. Deploy via Render's "New > Blueprint" pointing at this
# repo, or `render blueprint launch` with the Render CLI.
#
# Left unset on purpose (dev-stub-vs-real pattern — same code path as local
# dev, just without live vendor credentials): TWILIO_*, ONFIDO_*, AWS_KMS_KEY_ID
# + AWS creds, STRIPE_*, AVATAR_STORAGE. Add any of these later in the Render
# dashboard to switch that one feature over to its real integration — nothing
# else needs to change.
#
# Note: avatar/gallery uploads land on local disk (server/uploads/) — on
# Render's free plan that's ephemeral and will be wiped on every deploy or
# restart. Attach a persistent Disk to the web service (needs a paid plan) if
# you want uploads to survive.

databases:
  - name: hookups-db
    plan: free
    databaseName: hookups
    user: hookups

services:
  - type: redis
    name: hookups-redis
    plan: free
    ipAllowList: []

  - type: web
    name: hookups
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: hookups-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hookups-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: PIN_SALT_PREFIX
        generateValue: true
